name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. latest, next)'
        required: false
        default: 'latest'

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC).
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm >= 11.5.1
        run: npm i -g npm@^11.5.1

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Tag and package.json versions match: $PKG_VERSION"

      - name: Build package
        run: pnpm run build

      - name: Resolve npm dist-tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            case "$PKG_VERSION" in
              *-pre.*|*-fork.*|*-alpha.*|*-beta.*|*-rc.*|*-next.*)
                echo "value=next" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "value=latest" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Publish to npm
        # Auth strategy:
        #   - First-ever publish: requires NPM_TOKEN repo secret (npm Trusted Publishing
        #     can only be configured on a package that already exists).
        #   - After Trusted Publishing is enabled in npmjs.com → @tctony/difit → Access →
        #     Trusted Publishers, the NPM_TOKEN secret can be removed and this step
        #     authenticates entirely via the OIDC token granted by `id-token: write`.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag "${{ steps.tag.outputs.value }}"
